name: Backy Radar CI

on:
  push:
    branches: [main, launch-v1]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m py_compile app.py models.py config_data.py cron_ingest.py services/search.py services/classifier.py services/direct_feed.py services/ecosystem.py
      - name: Check browser JavaScript
        run: node --check static/app.js
      - name: Flask smoke test
        env:
          DATABASE_URL: sqlite:///ci_backy_radar.db
          SECRET_KEY: ci-test-key
        run: |
          python - <<'PY'
          from app import app
          with app.test_client() as client:
              assert client.get("/health").status_code == 200
              assert client.get("/").status_code == 200
              assert client.get("/api/stats").status_code == 200
              assert client.get("/api/leads").status_code == 200
              assert client.get("/api/accounts").status_code == 200
              assert client.get("/api/tracked-entities").status_code == 200
              assert client.get("/api/sources").status_code == 200
              assert client.get("/api/quality").status_code == 200
          print("Backy Radar smoke test passed")
          PY
