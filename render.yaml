databases:
  - name: backy-radar-db
    plan: free
    region: singapore
    databaseName: backyradar
    user: backyradar

services:
  - type: web
    name: backy-radar
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: backy-radar-db
          property: connectionString
      - key: APP_PASSWORD
        sync: false

  - type: cron
    name: backy-radar-scan
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    schedule: "0 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python cron_ingest.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: backy-radar-db
          property: connectionString
      - key: SCAN_PRESET
        value: all
