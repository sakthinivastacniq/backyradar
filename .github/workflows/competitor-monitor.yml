name: Competitor intelligence monitor
on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'competitor_monitor.py'
      - 'competitor_news.py'
      - 'competitor_data/profiles.json'
      - '.github/workflows/competitor-monitor.yml'
permissions:
  contents: write
concurrency:
  group: competitor-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install flask requests beautifulsoup4 pytest
      - run: python -m pytest -q test_competitor_monitor.py test_competitor_news.py
      - run: python competitor_monitor.py
      - name: Save public discovery feed
        run: |
          git config user.name "Backy intelligence monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add competitor_data/feed.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh competitor news discovery feed"
            git push
          fi
